<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thai Lottery Analyzer</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#17202a}
*{box-sizing:border-box} body{margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}
.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:20px;box-shadow:0 5px 20px #0000000a;margin-bottom:18px}
h1{margin:0 0 8px;font-size:28px}.muted{color:#667085}
.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:18px}
label{font-weight:700;font-size:14px}select{width:100%;margin-top:7px;padding:11px;border:1px solid #d0d5dd;border-radius:10px;background:white;font-size:15px}
.actions{margin-top:16px;display:flex;gap:10px}.btn{border:0;border-radius:11px;padding:12px 20px;font-weight:800;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#eef2f6;color:#111827}
.status{margin-top:12px;padding:12px;border-radius:10px;background:#f8fafc;display:none}.error{background:#fff1f2;color:#9f1239}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;background:#f8fafc;border-radius:12px}.stat strong{display:block;font-size:25px;margin-top:4px}
.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}th{background:#f8fafc}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff}.bar{height:8px;background:#e5e7eb;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#111827}
@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr}.wrap{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>วิเคราะห์ผลสลากย้อนหลัง</h1>
    <div class="muted">เลือกตัวกรองให้เรียบร้อย แล้วกด “วิเคราะห์” เพื่อค้นหาและคำนวณผล</div>
    <div class="filters">
      <div><label>วัน<select id="weekday"><option value="">ไม่เลือก</option></select></label></div>
      <div><label>วันที่<select id="day"><option value="">ไม่เลือก</option></select></label></div>
      <div><label>เดือน<select id="month"><option value="">ไม่เลือก</option></select></label></div>
      <div><label>ปี<select id="year"><option value="">ไม่เลือก</option></select></label></div>
      <div><label>จันทรคติ<select id="lunar"><option value="">ไม่เลือก</option><option value="ข้างขึ้น">ข้างขึ้น</option><option value="ข้างแรม">ข้างแรม</option></select></label></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="analyze">🔍 วิเคราะห์</button>
      <button class="btn secondary" id="reset">ล้างตัวกรอง</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <div id="results" style="display:none">
    <div class="card">
      <h2>สรุปผล</h2>
      <div class="stats">
        <div class="stat">จำนวนงวดที่ตรงเงื่อนไข<strong id="count">0</strong></div>
        <div class="stat">คู่เลขท้าย 2 ตัวที่พบ<strong id="pairs">0</strong></div>
        <div class="stat">ช่วงข้อมูล<strong id="range">-</strong></div>
      </div>
    </div>

    <div class="card">
      <h2>ความถี่เลขท้าย 2 ตัว</h2>
      <div id="pairStats"></div>
    </div>

    <div class="card">
      <h2>ผลรางวัลย้อนหลัง</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>วันที่</th><th>วัน</th><th>จันทรคติ</th><th>รางวัลที่ 1</th><th>เลขท้าย 3 ตัว</th><th>เลขท้าย 2 ตัว</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script>
const api = "";
const $ = id => document.getElementById(id);
const months = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const weekdays = ["","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์","อาทิตย์"];

async function loadOptions(){
  const r = await fetch(api+"/api/options"); const d = await r.json();
  d.weekdays.forEach(x => $("weekday").insertAdjacentHTML("beforeend",`<option value="${x.value}">${x.label}</option>`));
  d.days.forEach(x => $("day").insertAdjacentHTML("beforeend",`<option value="${x}">${x}</option>`));
  d.months.forEach(x => $("month").insertAdjacentHTML("beforeend",`<option value="${x.value}">${x.label}</option>`));
  d.years.forEach(x => $("year").insertAdjacentHTML("beforeend",`<option value="${x}">${x}</option>`));
}
function showStatus(msg, error=false){$("status").textContent=msg;$("status").className="status"+(error?" error":"");$("status").style.display="block"}
function params(){
  const p=new URLSearchParams();
  const map={weekday:"weekday",day:"day",month:"month",year:"year_be",lunar:"lunar_side"};
  for(const [id,key] of Object.entries(map)){const v=$(id).value;if(v)p.set(key,v)}
  return p;
}
$("analyze").onclick=async()=>{
  const p=params();
  if(!p.toString()){showStatus("กรุณาเลือกตัวกรองอย่างน้อย 1 รายการ",true);$("results").style.display="none";return}
  showStatus("กำลังค้นหาและวิเคราะห์ข้อมูล...");
  const r=await fetch(api+"/api/analyze?"+p.toString()); const d=await r.json();
  if(!d.ok){showStatus(d.error,true);$("results").style.display="none";return}
  showStatus(`วิเคราะห์เสร็จแล้ว พบ ${d.count} งวด`);
  $("results").style.display="block";
  $("count").textContent=d.count;
  $("pairs").textContent=d.statistics.last2_pairs.length;
  $("range").textContent=d.count ? `${d.rows[d.rows.length-1].draw_date} → ${d.rows[0].draw_date}` : "-";
  $("tbody").innerHTML=d.rows.map(x=>`<tr>
    <td>${x.draw_date}</td><td>${weekdays[x.weekday]}</td>
    <td><span class="badge">${x.lunar_side}</span></td>
    <td><b>${x.first_prize}</b></td>
    <td>${x.last3_1||"-"}${x.last3_2?" / "+x.last3_2:""}</td>
    <td><b>${String(x.last2).padStart(2,"0")}</b></td>
  </tr>`).join("");
  const max=Math.max(1,...d.statistics.last2_pairs.map(x=>x.count));
  $("pairStats").innerHTML=d.statistics.last2_pairs.length ? d.statistics.last2_pairs.map(x=>{
    const label=x.pair[0]===x.pair[1]?x.pair:x.pair+" / "+x.pair.split("").reverse().join("");
    return `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>${label}</span><b>${x.count}</b></div><div class="bar"><i style="width:${x.count/max*100}%"></i></div></div>`;
  }).join("") : "<div class='muted'>ไม่พบข้อมูล</div>";
};
$("reset").onclick=()=>{["weekday","day","month","year","lunar"].forEach(id=>$(id).value="");$("results").style.display="none";$("status").style.display="none"};
loadOptions();
</script>
</body>
</html>
